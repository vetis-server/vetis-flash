[package]
name = "vetis-flash"
version = "0.1.0-beta.1"
edition = "2024"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
repository = "https://github.com/vetis-server/vetis-flash"
homepage = "https://github.com/vetis-server/vetis"
description = "Very Tiny Server Flash Static Content support"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["http", "modules", "server", "rest-server"]
publish = true
rust-version = "1.86.0"

[lints.cargo]
unused_dependencies = "deny"

[package.metadata.cargo-machete]
ignored = ["cel"]

[features]
default = ["runtime-tokio"]
runtime-tokio = ["dep:vetis-tokio", "dep:tokio"]

[dependencies]
cel = "0.16.0"
http = "1.5.0"
hyper-body-utils = { version = "0.1.18", default-features = false }
serde = { version = "1.0.228", features = ["derive", "rc"] }
tokio = { version = "1.54.1", optional = true }
typetag = "0.2.22"
vetis = { path = "../vetis/vetis" }
vetis-tokio = { path = "../vetis-tokio", optional = true }
upon = "0.11.0"

[dev-dependencies]
caramelo = "0.1.5"
deboa = { version = "0.1.5" }
deboa-tokio = { version = "0.1.4", default-features = false, features = [
  "http2",
  "rust-tls",
  "default-rustls-provider",
  "default-rustls-verifier",
] }
serde_yaml_ng = "0.10.0"
tokio = { version = "1.54.1", default-features = false, features = ["macros"] }
vetis-macros = { path = "../vetis/vetis-macros" }

# [patch.crates-io]
