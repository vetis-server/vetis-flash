[package]
name = "vetis-flash"
version = "0.1.0-beta.1"
edition = "2024"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
repository = "https://github.com/vetis-server/vetis-flash"
homepage = "https://github.com/vetis-server/vetis"
description = "Very Tiny Server Flash Static Content support"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["http", "modules", "server", "rest-server"]
publish = true
rust-version = "1.85.0"

[features]
default = ["runtime-tokio"]
runtime-tokio = ["dep:vetis-tokio", "dep:tokio"]

[dependencies]
http = "1.5.0"
hyper-body-utils = { version = "0.1.18", default-features = false }
log = "0.4.34"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.53.1", optional = true }
typetag = "0.2.21"
vetis = { version = "0.1.7-beta.6" }
vetis-tokio = { version = "0.1.2-beta.8", optional = true }
upon = "0.11.0"

[dev-dependencies]
caramelo = "0.1.5"
deboa = { version = "0.1.5-beta.7" }
deboa-tokio = { version = "0.1.4-beta.8", default-features = false, features = [
  "http2",
  "rust-tls",
  "default-rustls-provider",
  "default-rustls-verifier",
] }
serde_yaml_ng = "0.10.0"
tokio = { version = "1.53.1", default-features = false, features = ["macros"] }
vetis-macros = { version = "0.1.3-beta.5" }
